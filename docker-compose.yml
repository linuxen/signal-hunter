services:
  feedwatch:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/feedwatch.db}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-30}
    volumes:
      - feedwatch_data:/app/data

volumes:
  feedwatch_data:
